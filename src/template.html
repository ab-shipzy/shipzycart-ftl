  }
  /* Mono utility class for figures (AWB, ₹, percentages) */
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'zero', 'ss02'; font-variant-numeric: tabular-nums; }

  /* ===== Mobile-responsive global rules ===== */

  /* Kill the default iOS / Android blue tap-highlight flash on every clickable
     element. We have our own active / hover states. */
  * { -webkit-tap-highlight-color: transparent; }

  /* Disable iOS rubber-band / overscroll which interferes with sticky
     positioning and feels non-native. Body still scrolls. */
  html, body { overscroll-behavior-y: none; -webkit-overflow-scrolling: touch; }

  /* iOS auto-zooms on focused input when computed font-size < 16px.
     The dashboard uses 12.5px for inputs (correct on desktop). Override
     to 16px on mobile to prevent the zoom. */
  @media (max-width: 640px) {
    input:not([type="checkbox"]):not([type="radio"]),
    select, textarea {
      font-size: 16px !important;
    }
  }

  /* Boost icon-only button tap targets on mobile only. Most icon buttons
     in the dashboard are 24-28px which is well below the iOS HIG (44px)
     and Material guideline (48px). Apply min-size on mobile only so the
     desktop layout stays compact. */
  @media (max-width: 640px) {
    button, a[role="button"], [role="button"] {
      min-height: 36px;
      min-width: 36px;
    }
    /* Opt out: tight buttons inside compact rows that would break layout */
    [data-tight] { min-height: 0 !important; min-width: 0 !important; }
  }

  /* Dynamic viewport-height utilities. iOS Safari counts the URL bar in
     100vh, making fixed/sticky elements taller than the visible viewport.
     100dvh excludes that. Modern browsers honour it; older fall back. */
  .h-screen-dvh { height: 100vh; height: 100dvh; }
  .min-h-screen-dvh { min-height: 100vh; min-height: 100dvh; }

  /* Custom scrollbar (used by .scrollbar-thin in the JSX) */
  .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(0,48,74,.18); border-radius: 3px; }
  .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(0,48,74,.32); }

  /* Safe-area helpers for drawer footers and sticky toolbars */
  .pb-safe { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
  .pt-safe { padding-top:    max(0.5rem, env(safe-area-inset-top)); }

  /* Prevent horizontal scroll bleed when wide tables sit inside a parent —
     common cause of the page wobbling under the thumb on Android. */
  body { overflow-x: hidden; }

  /* Smooth momentum scroll for horizontal toolbars (drawer tab strips,
     status pill rails on mobile, table x-overflow). */
  .overflow-x-auto { -webkit-overflow-scrolling: touch; }

  /* ===== Branded loader animations =====
     Y-axis (vertical-axis) coin-flip rotation. Linear easing for
     constant angular velocity. The wrapper sets `perspective` so the
     rotation reads as 3D depth instead of just looking squashed. */
  @keyframes shipzy-spin {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(360deg); }
  }
  .shipzy-spin {
    animation: shipzy-spin 1.2s linear infinite;
    transform-style: preserve-3d;
    backface-visibility: visible;
    will-change: transform;
  }
  .shipzy-spin-wrap {
    perspective: 600px;
    display: inline-block;
  }

  
  /* ============================================================
     WEATHER MOOD — full-page themed overlay + animations.
     Behind everything (z-index -1), pointer-events: none, so it
     never blocks UI interaction.
     ============================================================ */
  .weather-mood-bg {
    position: fixed; inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
  }
  .weather-gradient {
    position: absolute; inset: 0;
    transition: background 1.2s ease;
  }

  /* Rain — vertical streaks, fast loop, low opacity */
  .weather-rain span {
    position: absolute;
    top: -10%;
    width: 1px; height: 60px;
    background: linear-gradient(180deg, transparent, rgba(99,102,241,.35) 80%, transparent);
    animation: rain-fall linear infinite;
    will-change: transform;
  }
  @keyframes rain-fall {
    0%   { transform: translateY(-10vh); }
    100% { transform: translateY(110vh); }
  }

  /* Snow — drifting flakes */
  .weather-snow span {
    position: absolute;
    top: -5%;
    color: rgba(255,255,255,.8);
    animation: snow-fall linear infinite;
    text-shadow: 0 0 2px rgba(0,0,0,.1);
    will-change: transform;
  }
  @keyframes snow-fall {
    0%   { transform: translateY(-5vh) translateX(0); }
    50%  { transform: translateY(50vh) translateX(20px); }
    100% { transform: translateY(110vh) translateX(0); }
  }

  /* Stars — twinkle on a dark sky */
  .weather-stars span {
    position: absolute;
    width: 2px; height: 2px;
    background: white; border-radius: 50%;
    box-shadow: 0 0 4px rgba(255,255,255,.6);
    animation: star-twinkle 3s ease-in-out infinite;
  }
  @keyframes star-twinkle {
    0%,100% { opacity: 0.2; transform: scale(0.8); }
    50%     { opacity: 1;   transform: scale(1.2); }
  }

  /* Heat — wavy lines rising */
  .weather-heat span {
    position: absolute;
    bottom: -5%;
    width: 50px; height: 100vh;
    background: radial-gradient(circle at top, rgba(249,115,22,.08), transparent 50%);
    animation: heat-rise linear infinite;
    filter: blur(8px);
    will-change: transform;
  }
  @keyframes heat-rise {
    0%   { transform: translateY(0)      scaleX(1); opacity: 0.5; }
    50%  { transform: translateY(-30vh)  scaleX(1.4); opacity: 0.8; }
    100% { transform: translateY(-110vh) scaleX(0.6); opacity: 0; }
  }

  /* Sun — single warm radial glow in top-right */
  .weather-sun {
    position: absolute;
    top: -150px; right: -150px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(254,215,107,.55) 0%, rgba(254,215,107,0) 60%);
    border-radius: 50%;
    animation: sun-pulse 8s ease-in-out infinite;
    filter: blur(20px);
  }
  @keyframes sun-pulse {
    0%,100% { transform: scale(1); opacity: 0.85; }
    50%     { transform: scale(1.1); opacity: 1; }
  }

  /* Frost — small crystalline dots scattered */
  .weather-frost span {
    position: absolute;
    width: 4px; height: 4px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255,255,255,.7), 0 0 2px rgba(99,179,237,.5);
    animation: frost-pulse 4s ease-in-out infinite;
  }
  @keyframes frost-pulse {
    0%,100% { opacity: 0.3; transform: scale(0.7); }
    50%     { opacity: 0.85; transform: scale(1.15); }
  }

  /* Breeze — soft horizontal streamers */
  .weather-breeze span {
    position: absolute;
    left: -15%;
    width: 200px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(16,185,129,.35), transparent);
    animation: breeze-drift linear infinite;
    will-change: transform;
  }
  @keyframes breeze-drift {
    0%   { transform: translateX(0);     opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateX(120vw); opacity: 0; }
  }

  /* Fog — slowly drifting cloud layer */
  .weather-fog {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(255,255,255,.4), transparent 40%),
      radial-gradient(ellipse at 70% 60%, rgba(255,255,255,.35), transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(255,255,255,.3), transparent 45%);
    animation: fog-drift 25s ease-in-out infinite alternate;
    filter: blur(8px);
  }
  @keyframes fog-drift {
    0%   { transform: translateX(0)    scale(1); }
    100% { transform: translateX(-40px) scale(1.05); }
  }

  /* Honour reduced-motion: kill all weather animations */
  @media (prefers-reduced-motion: reduce) {
    .weather-rain span,
    .weather-snow span,
    .weather-stars span,
    .weather-heat span,
    .weather-sun,
    .weather-frost span,
    .weather-breeze span,
    .weather-fog {
      animation: none !important;
    }
  }

  /* Subtle scale pulse layered on top — mark feels alive */
  @keyframes shipzy-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(0.95); opacity: 0.85; }
  }
  .shipzy-pulse {
    animation: shipzy-pulse 1.2s ease-in-out infinite;
  }

  /* Page-transition fade — used on main content area on route change.
     IMPORTANT: the `to` keyframe must use `transform: none` rather than
     `translateY(0)`. With `animation-fill-mode: both`, the `to` state
     persists after the animation completes — and any non-none transform
     value (including `translateY(0)`) creates a NEW containing block for
     position:fixed descendants, which breaks drawers/modals that use
     `inset-0` (they get clipped to the page content height instead of
     the viewport). */
  @keyframes shipzy-page-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }
  .shipzy-page-in {
    animation: shipzy-page-in 0.18s ease-out both;
  }

  /* Save-indicator pulsing ring on the SC avatar */
  @keyframes shipzy-save-ring {
    0%   { box-shadow: 0 0 0 0   rgba(67, 237, 212, 0.7); }
    70%  { box-shadow: 0 0 0 8px rgba(67, 237, 212, 0); }
    100% { box-shadow: 0 0 0 0   rgba(67, 237, 212, 0); }
  }
  .shipzy-save-ring {
    animation: shipzy-save-ring 0.8s ease-out 1;
  }
  /* Loader shown until React boots */
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--bg); z-index: 9999;
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: opacity .3s ease;

  #boot .b { display:flex; align-items:center; gap: 10px; color: var(--navy); font-size: 13px; }
  #boot .ring {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2.5px solid #e5e7eb; border-top-color: var(--brand);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot.gone { opacity: 0; pointer-events: none; }
</style>

  return function Icon({ size = 24, className = "", strokeWidth, ...rest }) {
    const lib = window.lucide;

      width: size,
      height: size,
      strokeWidth: strokeWidth || defaultAttrs.strokeWidth || 2,
      className,
      ...rest,
    }, ...(children || []).map(renderChild).filter(Boolean));
  };
}
